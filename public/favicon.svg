<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- STICKOS 3D — isotipo: la "S" con el layer shift del wordmark (opción A
       del manual), montada en pastilla Ink para que se recorte tanto en
       pestañas claras como oscuras. -->
  <defs>
    <g id="s" fill="#FF5A1F">
      <rect x="5" y="5" width="21" height="5"/>
      <rect x="5" y="10" width="5" height="6"/>
      <rect x="5" y="14" width="21" height="5"/>
      <rect x="21" y="19" width="5" height="5"/>
      <rect x="5" y="22" width="21" height="5"/>
    </g>
    <clipPath id="t"><rect x="0" y="0" width="32" height="16.5"/></clipPath>
    <clipPath id="b"><rect x="0" y="16.5" width="32" height="15.5"/></clipPath>
  </defs>
  <rect width="32" height="32" rx="7" fill="#14120F"/>
  <g transform="translate(16,16) scale(.82) translate(-16,-16)">
    <g transform="translate(3,0)"><g clip-path="url(#t)"><use href="#s"/></g></g>
    <g clip-path="url(#b)"><use href="#s"/></g>
  </g>
</svg>
